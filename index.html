<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Converter</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }

        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .box{
            height: 300px;
            width: 500px;
            background-color: rgb(89, 207, 233);
            border-radius: 20px;
            /* display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; */
        }

        h1{
            margin: 10px 60px ;
            padding-left: 20px;
        }
        p{
            margin: 40px 0px 20px 0px;
            font-size: large;
            padding-left: 20px;
        }
        #Form{
            padding-left: 20px;
        }
        #TempInput{
            height: 30px;
            border: none;
            border-radius: 10px;
            width: 70px;
        }
        #TempInput:hover{
            border: 2px solid black;
        }
        #fromUnit , #toUnit , #cnvrtbtn{
            height: 30px;
            width: 150px;
            border: none;
            border-radius: 10px;

        }
        #fromUnit:hover , #toUnit:hover , #cnvrtbtn:hover{
            border: 2px solid black;
        }

        #cnvrtbtn{
            margin-top: 20px;
        }

        #result{
            margin: 20px;
            font-size: large;

        }
        @media screen and (max-width: 320px ){
            .box{
            height: 380px;
            }
            p{
                margin: 20Px 0 10px 0;
            }
            #TempInput{
                margin-right: 150px ;
                margin-bottom: 10px;
            }
            #fromUnit , #toUnit , #cnvrtbtn{
            
            }
            #toUnit{
                margin-top: 10px;
            }
            #cnvrtbtn{
                margin-top: 10px;
            }
        }

    </style>
</head>
<body>
    
    <div class="container">
        <div class="box">
            <h1> Temperature Converter</h1>
            <p>Enter the Temperature, Select and Submit unit</p>
            
            <div id="Form">
                <input id="TempInput" type="number" placeholder="00.0"/>

                
                <select id="fromUnit">
                    <option value="" disabled selected> fromUnit</option>
                    <option value="Celcius"> fromCelcius</option>
                    <option value="Fahrenhite"> fromFahrenhite</option>
                    <option value="Kelvin"> fromKelvin</option>
                </select>


                <select id="toUnit">
                    <option value="" disabled selected> toUnit</option>
                    <option value="Celcius"> toCelcius</option>
                    <option value="Fahrenhite"> toFahrenhite</option>
                    <option value="Kelvin"> toKelvin</option>
                </select>

                <button id="cnvrtbtn" disabled>Convert</button>
                
            </div>
            <div id="result">
            </div>

        </div>
    </div>

<script>
    const TempInput = document.getElementById("TempInput");
    const fromUnit = document.getElementById("fromUnit");
    const toUnit = document.getElementById("toUnit");
    const cnvrtbtn = document.getElementById("cnvrtbtn");
    const result = document.getElementById("result");

    function checkinputs(){
        const val =TempInput.value.trim();
        const from =fromUnit.value;
        const to = toUnit.value;

        //buttun enable
        if(val !=="" && from !=="" && to !=="" ){
        cnvrtbtn.disabled=false;
        }
        else{
        cnvrtbtn.disabled=true;
        }
    }

    TempInput.addEventListener('input',checkinputs);
    fromUnit.addEventListener('change',checkinputs);
    toUnit.addEventListener('change',checkinputs);

    function convertTemperature(value,from,to){

        if(from === to){
            return value;
        }
        let Celcius;

        switch(from){
            case 'Fahrenhite':Celcius=(value-32)*5/9;
            break;
            case 'Kelvin':Celcius=value-273.15;
            break;
            default:Celcius=value;
        }

        switch(to){
            case 'Fahrenhite':return(Celcius * 9/5)+32;
            break;
            case 'Kelvin':return Celcius+273.15;
            break;
            default: return Celcius;
        }

    }

    cnvrtbtn.addEventListener('click',() =>{
        
        const numValue = Number(TempInput.value);
        const from = fromUnit.value;
        const to = toUnit.value;

        const finalResult = convertTemperature(numValue , from , to);

        const formattedResult = Number.isInteger(finalResult)? finalResult: finalResult.toFixed(1);

        result.textContent = `${numValue} ${from} is ${formattedResult} ${to}`;
    });
</script>
</body>
</html>
